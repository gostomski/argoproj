apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: mergestat
  repo: https://helm.mergestat.com/
  releaseName: mergestat
  namespace: prediktor
  version: 1.0.0
  valuesFile: values.yaml

resources:
- job.yaml

patches:
- path: patches/node_affinity_deployment.yaml
  target:
    kind: Deployment
